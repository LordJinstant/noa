<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOA Certificate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @keyframes noaSheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .noa-sheen {
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 48%, transparent 66%);
      background-size: 220% 100%;
      animation: noaSheen 7s ease-in-out infinite;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .noa-sheen { animation: none; opacity: 0.1; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="no-print bg-white border-b sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="index.html" class="font-black text-[#19A975] text-lg">NOA · Higher Move</a>
      <div class="flex gap-2">
        <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold"><i class="fas fa-print mr-1"></i>Print / PDF</button>
        <button onclick="location.href='index.html'" class="px-4 py-2 rounded-xl border text-sm font-semibold">Close · Website</button>
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto p-4 sm:p-8">
    <div id="status" class="text-center text-slate-500 py-16">Loading certificate…</div>
    <div id="certBox" class="hidden"></div>
  </main>
  <script>
    function band(pct) {
      const p = Number(pct) || 0;
      if (p >= 95) return { label: 'Outstanding', color: '#7c3aed' };
      if (p >= 85) return { label: 'Excellent', color: '#19A975' };
      if (p >= 70) return { label: 'Good', color: '#0ea5e9' };
      if (p >= 50) return { label: 'Average', color: '#f59e0b' };
      return { label: 'Needs Improvement', color: '#94a3b8' };
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function subjectSummariesFrom(data) {
      if (Array.isArray(data.subjectSummaries) && data.subjectSummaries.length) return data.subjectSummaries;
      const scores = data.scores || [];
      const by = {};
      scores.forEach(r => {
        const k = String(r.subject || 'General').trim() || 'General';
        if (!by[k]) by[k] = { subject: k, sum: 0, count: 0, best: 0, lastDate: '', rawSum: 0, supposedSum: 0 };
        const pct = Number(r.percentage) || 0;
        by[k].sum += pct; by[k].count += 1;
        by[k].rawSum += Number(r.score) || 0;
        by[k].supposedSum += Number(r.supposed_score) || 0;
        if (pct > by[k].best) by[k].best = pct;
        if (!by[k].lastDate || String(r.assessed_at || '') > by[k].lastDate) by[k].lastDate = r.assessed_at || '';
      });
      return Object.keys(by).map(k => {
        const r = by[k];
        const overallPct = Math.round((r.sum / r.count) * 10) / 10;
        return {
          subject: r.subject, attempts: r.count, overall: overallPct, best: r.best,
          lastDate: r.lastDate, totalScore: r.rawSum, totalOutOf: r.supposedSum, band: band(overallPct)
        };
      }).sort((a, b) => (b.overall || 0) - (a.overall || 0));
    }
    async function main() {
      const v = new URLSearchParams(location.search).get('v');
      const status = document.getElementById('status');
      if (!v) {
        status.innerHTML = '<p class="mb-4">No certificate in this link.</p><a href="index.html" class="text-[#19A975] font-semibold underline">Go to website</a>';
        return;
      }
      try {
        const res = await fetch('/api/certificate/' + encodeURIComponent(v));
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || 'Not found');
        const s = data.student || {};
        const overall = data.overall || 0;
        const b = data.band && data.band.label ? data.band : band(overall);
        const bandColor = b.color || band(overall).color;
        const bandLabel = b.label || band(overall).label;
        const serial = data.serial || v;
        const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=' + encodeURIComponent(data.verifyUrl || location.href);
        const name = esc(s.name || s.username || 'Student');
        const summaries = subjectSummariesFrom(data);
        const subjectRows = summaries.map((r, i) => {
          const bb = r.band || band(r.overall);
          const bc = bb.color || band(r.overall).color;
          const bl = bb.label || band(r.overall).label;
          return `<tr>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0;font-weight:700;color:#0f172a">
              <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${i < 3 ? bc : '#e2e8f0'};color:${i < 3 ? '#fff' : '#64748b'};font-size:10px;font-weight:800;margin-right:8px">${i + 1}</span>
              ${esc(r.subject)}
            </td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0;color:#475569">${r.attempts || 0}</td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0;color:#475569">${r.totalScore != null ? r.totalScore : '—'} / ${r.totalOutOf != null ? r.totalOutOf : '—'}</td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0"><span style="font-size:18px;font-weight:900;color:#19A975">${r.overall != null ? r.overall : '—'}%</span></td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0;font-weight:600;color:#0f766e">${r.best != null ? r.best + '%' : '—'}</td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0">
              <span style="display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;background:${bc}18;color:${bc};border:1px solid ${bc}40">${esc(bl)}</span>
            </td>
            <td style="padding:12px 14px;border-bottom:1px solid #e2e8f0;color:#94a3b8;font-size:12px">${esc(r.lastDate)}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="7" style="padding:20px;text-align:center;color:#94a3b8">No subject scores recorded yet</td></tr>';

        status.classList.add('hidden');
        const box = document.getElementById('certBox');
        box.classList.remove('hidden');
        box.innerHTML = `
          <div style="position:relative;overflow:hidden;width:100%;max-width:960px;margin:0 auto;min-height:560px;box-sizing:border-box;
            box-shadow:0 30px 60px -20px rgba(15,23,42,0.28);
            background:
              radial-gradient(ellipse 90% 55% at 50% -15%, rgba(212,175,55,0.22), transparent 50%),
              radial-gradient(ellipse 50% 40% at 0% 100%, rgba(25,169,117,0.14), transparent 55%),
              radial-gradient(ellipse 45% 35% at 100% 90%, rgba(15,118,110,0.12), transparent 50%),
              linear-gradient(165deg, #fffef8 0%, #f7fffb 45%, #ffffff 100%);
            font-family:Georgia,'Times New Roman',serif;color:#0f172a">
            <div style="position:absolute;inset:10px;border:3px solid #c9a227;pointer-events:none;z-index:2"></div>
            <div style="position:absolute;inset:16px;border:1.5px solid #19A975;pointer-events:none;z-index:2"></div>
            <div style="position:absolute;inset:22px;border:1px solid rgba(201,162,39,0.35);pointer-events:none;z-index:2"></div>
            <div style="position:absolute;top:28px;left:28px;width:48px;height:48px;border-top:3px solid #c9a227;border-left:3px solid #c9a227;z-index:3"></div>
            <div style="position:absolute;top:28px;right:28px;width:48px;height:48px;border-top:3px solid #c9a227;border-right:3px solid #c9a227;z-index:3"></div>
            <div style="position:absolute;bottom:28px;left:28px;width:48px;height:48px;border-bottom:3px solid #c9a227;border-left:3px solid #c9a227;z-index:3"></div>
            <div style="position:absolute;bottom:28px;right:28px;width:48px;height:48px;border-bottom:3px solid #c9a227;border-right:3px solid #c9a227;z-index:3"></div>
            <div class="noa-sheen" style="pointer-events:none;position:absolute;inset:0;z-index:1"></div>
            <div style="position:relative;z-index:4;padding:48px 52px 36px;display:flex;flex-direction:column;min-height:520px">
              <div style="text-align:center">
                <div style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;
                  background:radial-gradient(circle at 35% 30%, #fde68a, #c9a227 55%, #92400e);
                  box-shadow:0 8px 24px rgba(201,162,39,0.45), inset 0 2px 8px rgba(255,255,255,0.5);
                  border:3px solid #fef3c7;margin-bottom:10px">
                  <span style="font-size:26px;font-weight:900;color:#0f172a;font-family:system-ui,sans-serif;letter-spacing:-1px">NOA</span>
                </div>
                <div style="letter-spacing:0.35em;font-size:11px;color:#0f766e;font-weight:800;text-transform:uppercase;font-family:system-ui,sans-serif">Nigeria Olympiad Academy</div>
                <div style="width:120px;height:2px;background:linear-gradient(90deg,transparent,#c9a227,#19A975,#c9a227,transparent);margin:10px auto"></div>
                <h1 style="font-size:34px;margin:6px 0 2px;font-weight:800;letter-spacing:0.04em;color:#0f172a">Certificate of Performance</h1>
                <p style="margin:0;color:#64748b;font-size:13px;font-style:italic">Higher Move · Official academic distinction</p>
              </div>
              <div style="text-align:center;margin:22px 0 8px">
                <p style="margin:0;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#94a3b8;font-family:system-ui,sans-serif">Proudly awarded to</p>
                <p style="margin:10px 0 0;font-size:32px;font-weight:800;color:#0f172a;line-height:1.15">${name}</p>
                <div style="width:min(420px,80%);height:3px;margin:10px auto 0;background:linear-gradient(90deg,transparent,#19A975 20%,#c9a227 50%,#19A975 80%,transparent)"></div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;max-width:640px;margin:18px auto 0;width:100%;font-family:system-ui,sans-serif">
                <div style="text-align:center;padding:12px 10px;border-radius:16px;background:rgba(255,255,255,0.65);border:1px solid rgba(25,169,117,0.15)">
                  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#94a3b8;font-weight:700">School</div>
                  <div style="font-size:13px;font-weight:700;margin-top:4px">${esc(s.school || '—')}</div>
                </div>
                <div style="text-align:center;padding:12px 10px;border-radius:16px;background:rgba(255,255,255,0.65);border:1px solid rgba(25,169,117,0.15)">
                  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#94a3b8;font-weight:700">Grade</div>
                  <div style="font-size:13px;font-weight:700;margin-top:4px">${esc(s.grade || '—')}</div>
                </div>
                <div style="text-align:center;padding:12px 10px;border-radius:16px;background:rgba(255,255,255,0.65);border:1px solid rgba(25,169,117,0.15)">
                  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#94a3b8;font-weight:700">Band</div>
                  <div style="font-size:13px;font-weight:800;margin-top:4px;color:${bandColor}">${esc(bandLabel)}</div>
                </div>
              </div>
              <div style="text-align:center;margin:20px auto 0">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:#94a3b8;font-family:system-ui,sans-serif;font-weight:700">Overall average</div>
                <div style="font-size:48px;font-weight:900;line-height:1;margin-top:4px;color:#19A975">${overall}%</div>
              </div>
              <p style="text-align:center;font-size:13px;color:#475569;line-height:1.55;max-width:540px;margin:16px auto 0;font-style:italic">
                In recognition of measured achievement, disciplined practice, and distinction on the Nigeria Olympiad Academy platform.
              </p>
              <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:auto;padding-top:28px;flex-wrap:wrap;font-family:system-ui,sans-serif">
                <div style="text-align:center;min-width:140px">
                  <div style="height:36px;margin-bottom:4px;display:flex;align-items:flex-end;justify-content:center">
                    <span style="font-family:Georgia,serif;font-style:italic;font-size:20px;color:#0f766e;opacity:0.85">NOA</span>
                  </div>
                  <div style="border-top:1.5px solid #94a3b8;padding-top:6px;font-size:11px;font-weight:600;color:#334155">Director, NOA</div>
                </div>
                <div style="text-align:center">
                  <div style="display:inline-block;padding:8px;background:#fff;border:2px solid #c9a227;border-radius:12px;box-shadow:0 4px 14px rgba(201,162,39,0.25)">
                    <img src="${qr}" alt="QR" width="96" height="96" style="display:block" />
                  </div>
                  <div style="font-size:9px;color:#64748b;margin-top:6px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase">Official verification</div>
                  <div style="font-size:10px;font-family:ui-monospace,monospace;color:#0f766e;margin-top:4px;font-weight:800;letter-spacing:0.04em;max-width:200px;word-break:break-all">${esc(serial)}</div>
                </div>
                <div style="text-align:center;min-width:140px">
                  <div style="height:36px"></div>
                  <div style="border-top:1.5px solid #94a3b8;padding-top:6px;font-size:11px;font-weight:600;color:#334155">Issued ${esc(data.issuedAt)}</div>
                </div>
              </div>
            </div>
          </div>
          <div style="margin:32px auto 8px;max-width:960px;background:#fff;border-radius:20px;overflow:hidden;
            box-shadow:0 16px 40px -16px rgba(15,23,42,0.18);border:1px solid #e2e8f0;font-family:system-ui,-apple-system,sans-serif">
            <div style="padding:20px 24px;background:linear-gradient(135deg,#0f172a 0%,#134e4a 55%,#19A975 100%);color:#fff">
              <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
                <div>
                  <div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.8;font-weight:700">Official record</div>
                  <h2 style="font-size:22px;margin:4px 0 0;font-weight:900">Academic Report Card</h2>
                  <p style="margin:6px 0 0;font-size:13px;opacity:0.9">Overall score for each subject taken by ${name}</p>
                </div>
                <div style="text-align:right">
                  <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.75">Composite average</div>
                  <div style="font-size:28px;font-weight:900">${overall}%</div>
                </div>
              </div>
            </div>
            <div style="padding:8px 8px 16px;overflow-x:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:640px">
                <thead>
                  <tr style="text-align:left;background:#f8fafc">
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Subject</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Attempts</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Points</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Overall %</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Best %</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Band</th>
                    <th style="padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:800">Last taken</th>
                  </tr>
                </thead>
                <tbody>${subjectRows}</tbody>
              </table>
            </div>
            <div style="padding:12px 20px 18px;border-top:1px solid #f1f5f9;font-size:11px;color:#94a3b8">
              Nigeria Olympiad Academy · Higher Move · Signed academic record
            </div>
          </div>`;
      } catch (e) {
        status.innerHTML = '<p class="text-red-500 mb-3">' + esc(e.message) + '</p><a href="index.html" class="text-[#19A975] underline">Website</a>';
      }
    }
    main();
  </script>
</body>
</html>
